name: Certificate Status

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      force_renew:
        description: Attempt renewal regardless of days remaining
        required: false
        default: false
        type: boolean

concurrency:
  group: certificate-status-${{ github.ref }}
  cancel-in-progress: false

env:
  DOMAIN: valoutils-tools.windowsed.me
  PFX_URL: https://valoutils-tools.windowsed.me/valoutils/localhost.pfx

jobs:
  certificate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Run local test suite
        run: bash tests/run.sh

      - name: Restore published PFX
        id: pfx
        run: |
          set -euo pipefail
          mkdir -p docs/valoutils
          pfx_tmp=$(mktemp)
          trap 'rm -f "$pfx_tmp"' EXIT
          if curl --fail --silent --show-error --location --max-time 20 \
              --max-filesize 1048576 \
              --output "$pfx_tmp" "$PFX_URL" \
            && bash scripts/check-pfx.sh "$pfx_tmp" "$DOMAIN"; then
            mv "$pfx_tmp" docs/valoutils/localhost.pfx
            printf 'exists=true\n' >> "$GITHUB_OUTPUT"
          else
            rm -f docs/valoutils/localhost.pfx
            printf 'exists=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Inspect stored certificate
        id: inspect
        env:
          FORCE_RENEW: ${{ inputs.force_renew || false }}
          PFX_EXISTS: ${{ steps.pfx.outputs.exists }}
        run: |
          set -euo pipefail
          inspection=$(scripts/check-cert.sh "docs/certificate.pem" "$DOMAIN")
          renew=$(python -c 'import json,sys; print(str(json.loads(sys.argv[1])["renewal_required"]).lower())' "$inspection")
          reason=$(python -c 'import json,sys; print(json.loads(sys.argv[1])["reason"])' "$inspection")
          if [[ "$PFX_EXISTS" != "true" ]]; then
            renew=true
            reason=pfx-missing
          fi
          if [[ "$FORCE_RENEW" == "true" ]]; then
            renew=true
            reason=forced
          fi
          printf 'renew=%s\nreason=%s\n' "$renew" "$reason" >> "$GITHUB_OUTPUT"

      - name: Renew with Let's Encrypt DNS-01
        id: renew
        if: steps.inspect.outputs.renew == 'true'
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          LETSENCRYPT_EMAIL: ${{ vars.LETSENCRYPT_EMAIL }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check certbot==5.7.0 certbot-dns-cloudflare==5.7.0
          mkdir -p artifacts
          scripts/renew-cert.sh \
            "$DOMAIN" \
            "docs/certificate.pem" \
            "docs/valoutils/localhost.pfx" \
            | tee artifacts/renewal.out

      - name: Generate public status
        run: |
          set -euo pipefail
          if [[ "${{ steps.inspect.outputs.renew }}" == "true" ]]; then
            if [[ "${{ steps.renew.outcome }}" == "success" ]]; then
              renewal_iso=$(sed -n 's/^last_renewal=//p' artifacts/renewal.out | tail -n 1)
              scripts/generate-status.sh \
                docs/certificate.pem docs/cert-status.json "$DOMAIN" "" "$renewal_iso"
            else
              scripts/generate-status.sh \
                docs/certificate.pem docs/cert-status.json "$DOMAIN" error
            fi
          else
            scripts/generate-status.sh \
              docs/certificate.pem docs/cert-status.json "$DOMAIN"
          fi

      - name: Commit public certificate status
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/certificate.pem docs/cert-status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          if [[ "${{ steps.inspect.outputs.renew }}" == "true" && "${{ steps.renew.outcome }}" == "success" ]]; then
            message="Renew $DOMAIN certificate"
          else
            message="Update certificate status"
          fi
          git commit -m "$message"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            git pull --rebase origin "$GITHUB_REF_NAME"
          done
          printf 'Could not push the public certificate status after three attempts\n' >&2
          exit 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Report renewal failure
        if: steps.inspect.outputs.renew == 'true' && steps.renew.outcome == 'failure'
        run: exit 1

  deploy:
    needs: certificate
    if: always() && needs.certificate.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
