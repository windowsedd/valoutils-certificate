name: Certificate Status

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      force_renew:
        description: Renew the certificate regardless of remaining validity
        required: false
        default: false
        type: boolean

concurrency:
  group: certificate-status-${{ github.ref }}
  cancel-in-progress: false

env:
  DOMAIN: valoutils-localhost.windowsed.me
  PFX_URL: https://windowsedd.github.io/valoutils-certificate/valoutils/localhost.pfx

jobs:
  certificate:
    runs-on: ubuntu-latest
    # Shares the github-pages environment so its secrets (CF_API_TOKEN) and
    # variables (LETSENCRYPT_EMAIL) are visible to the issuance job; the
    # deploy job waits for this one, so the environment is never contended.
    environment:
      name: github-pages
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Preflight credentials
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          LETSENCRYPT_EMAIL: ${{ vars.LETSENCRYPT_EMAIL }}
        run: |
          set -euo pipefail
          failed=0
          if [[ -z "$CF_API_TOKEN" ]]; then
            printf 'ERROR: The CF_API_TOKEN secret is not visible to this job.\n' >&2
            printf 'Add it with the exact name CF_API_TOKEN either as:\n' >&2
            printf '  - a repository secret:      https://github.com/%s/settings/secrets/actions\n' "$GITHUB_REPOSITORY" >&2
            printf '  - or a github-pages environment secret: https://github.com/%s/settings/environments/github-pages\n' "$GITHUB_REPOSITORY" >&2
            failed=1
          fi
          if [[ -z "$LETSENCRYPT_EMAIL" ]]; then
            printf 'ERROR: The LETSENCRYPT_EMAIL variable is not set.\n' >&2
            printf 'Add it with the exact name LETSENCRYPT_EMAIL either as:\n' >&2
            printf '  - a repository variable:    https://github.com/%s/settings/variables\n' "$GITHUB_REPOSITORY" >&2
            printf '  - or a github-pages environment variable (as a variable, not a secret)\n' "$GITHUB_REPOSITORY" >&2
            failed=1
          fi
          exit "$failed"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Run test suite
        run: bash tests/run.sh

      - name: Install Certbot with the Cloudflare DNS plugin
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "certbot==5.7.0" "certbot-dns-cloudflare==5.7.0"

      - name: Restore published PFX
        id: pfx
        run: |
          set -euo pipefail
          mkdir -p docs/valoutils
          pfx_tmp=$(mktemp)
          trap 'rm -f "$pfx_tmp"' EXIT
          if curl --fail --silent --show-error --location --max-time 20 \
              --max-filesize 1048576 \
              --output "$pfx_tmp" "$PFX_URL" \
            && bash scripts/check-pfx.sh "$pfx_tmp" "$DOMAIN"; then
            mv "$pfx_tmp" docs/valoutils/localhost.pfx
            printf 'exists=true\n' >> "$GITHUB_OUTPUT"
          else
            rm -f docs/valoutils/localhost.pfx
            printf 'exists=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Check and renew certificate
        id: certificate
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          LETSENCRYPT_EMAIL: ${{ vars.LETSENCRYPT_EMAIL }}
        run: |
          set -euo pipefail
          args=()
          if [[ "${{ inputs.force_renew }}" == "true" \
            || "${{ steps.pfx.outputs.exists }}" != "true" ]]; then
            args+=(--force-renew)
          fi
          scripts/certificate.sh "${args[@]}"

      - name: Publish renewed PFX
        if: hashFiles('pfx-output/*.pfx') != ''
        run: |
          set -euo pipefail
          mkdir -p docs/valoutils
          cp pfx-output/*.pfx docs/valoutils/localhost.pfx
          bash scripts/check-pfx.sh docs/valoutils/localhost.pfx "$DOMAIN"

      - name: Commit certificate changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/certificate.pem
          if git diff --cached --quiet; then
            printf 'No certificate changes to commit\n'
            exit 0
          fi
          if git cat-file -e "HEAD:docs/certificate.pem" 2>/dev/null \
            && [[ -n "$(git show "HEAD:docs/certificate.pem")" ]]; then
            message="Renew certificate for $DOMAIN"
          else
            message="Issue certificate for $DOMAIN"
          fi
          git commit -m "$message"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            git pull --rebase origin "$GITHUB_REF_NAME"
          done
          printf 'Could not push the certificate change after three attempts\n' >&2
          exit 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Report certificate failure
        if: steps.certificate.outcome == 'failure'
        run: |
          printf 'Certificate check or renewal failed; see the "Check and renew certificate" step.\n' >&2
          exit 1

  deploy:
    needs: certificate
    if: always() && needs.certificate.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
